name: CI — Backend Tests & Vercel Entrypoint Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Backend pytest, PII audit & Vercel API smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run full offline backend test suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          pytest backend/ --ignore=backend/test_migrations_postgres.py -q

      - name: Verify Vercel serverless entrypoint (api/index.py), security headers & zero-PII/secret guard
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          from fastapi.testclient import TestClient
          from api.index import app

          client = TestClient(app)
          summary = client.get("/api/demo/summary")
          assert summary.status_code == 200, summary.text
          data = summary.json()
          assert data["synthetic_only"] is False
          assert data["posts"] >= 70
          assert data["comments"] >= 700
          assert data["provenance"].get("dapt_summary") is not None
          assert data.get("confidence_summary") is not None
          assert len(data.get("cross_model_insights") or []) >= 3
          first_id = data["recent_discussions"][0]["id"]
          for route in (
              "/",
              "/health",
              "/app/",
              "/api/demo/health",
              "/api/demo/summary",
              "/api/demo/discussions",
              f"/api/demo/discussions/{first_id}",
              "/api/demo/issues",
              "/api/demo/topics",
              "/api/demo/sentiment",
              "/api/demo/responses",
              "/api/demo/resolution",
              "/api/demo/comparisons",
              "/api/demo/models",
              "/api/demo/error-analysis",
              "/api/demo/insights",
          ):
              res = client.get(route)
              assert res.status_code == 200, f"{route} returned {res.status_code}"
              assert res.headers.get("x-content-type-options") == "nosniff"
              assert res.headers.get("x-frame-options") == "DENY"
              assert res.headers.get("referrer-policy") == "strict-origin-when-cross-origin"
              assert "frame-ancestors 'none'" in res.headers.get("content-security-policy", "")

          an_res = client.post("/api/demo/analyze", json={"text": "Bhai IIM ABC ka summer placement scene kaisa hai 😭"})
          assert an_res.status_code == 200, f"/api/demo/analyze returned {an_res.status_code}"
          assert an_res.json()["language_detection"]["language"] == "hi-en"

          models_data = client.get("/api/demo/models").json()
          ver = models_data.get("benchmark_verification") or {}
          assert ver.get("verified") is True, f"Benchmark verification failed: {ver}"
          arch_agg = (models_data.get("architecture_comparison") or {}).get("aggregate") or {}
          for arch_key in ("logistic_regression", "ann_mlp", "cnn_textcnn", "transformer_muril_dapt_v3"):
              assert arch_key in arch_agg, f"Missing architecture {arch_key}"

          for corpus_candidate in (
              Path("data/live_corpus/corpus.json"),
              Path("data/corpus_v6_3/new_unannotated_corpus_v6_3.json"),
              Path("data/corpus_v6_4/new_iim_corpus_v6_4.json"),
          ):
              if not corpus_candidate.is_file():
                  continue
              raw = corpus_candidate.read_text(encoding="utf-8")
              assert not re.search(r"(?<![A-Za-z0-9_])/?u/[A-Za-z0-9_-]{3,24}\b", raw), f"u/ handle in {corpus_candidate}"
              assert not re.search(r"\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b", raw), f"email in {corpus_candidate}"
              assert not re.search(r"https?://(?:www\.|old\.)?reddit\.com/r/", raw, re.I), f"reddit URL in {corpus_candidate}"
          assert not Path("data/demo_synthetic").exists()
          assert Path("data/annotations/real_reddit_labeled_v1/master_labeled_v1.csv").is_file()

          # Reject orphaned gitlinks (160000 mode without .gitmodules)
          tree = subprocess.check_output(["git", "ls-tree", "HEAD"], text=True)
          gitlinks = [line for line in tree.splitlines() if line.startswith("160000 ")]
          if gitlinks and not Path(".gitmodules").exists():
              raise AssertionError(f"Orphaned gitlink(s) without .gitmodules: {gitlinks}")

          # Lightweight secret/private-key guard across tracked text files
          secret_re = re.compile(
              r"(ghp_|gho_|github_pat_)[A-Za-z0-9_]{16,}"
              r"|AKIA[0-9A-Z]{16}"
              r"|-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----"
          )
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          for rel in tracked:
              p = Path(rel)
              if not p.is_file() or p.suffix.lower() in {".png", ".jpg", ".webp", ".joblib", ".pdf", ".xlsx"}:
                  continue
              if p.name == ".env" or p.name.endswith(".pem") or p.name.endswith(".key"):
                  raise AssertionError(f"Sensitive file tracked in Git: {rel}")
              text = p.read_text(encoding="utf-8", errors="ignore")
              if secret_re.search(text):
                  raise AssertionError(f"Potential secret token matched in {rel}")

          print(
              f"Verified all 15 Vercel routes + 4-arch benchmark verifier + security headers + zero-PII/secret/gitlink guards OK: "
              f"v{data['dataset_version']} ({data['posts']} threads, {data['comments']} comments)."
          )
          PY

  test-ml-optional:
    name: Optional ML & V6.3 Reliability Suite (XGBoost, BERTopic, Cache, Resolution, IAA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-ml.txt

      - name: Install base + optional ML dependencies (CPU PyTorch + Keras 3 + XGBoost + BERTopic)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.19.0 tokenizers==0.23.3 sentence-transformers==6.3.0 bertopic==0.17.4 umap-learn==0.6.0 hdbscan==0.8.44 xgboost==3.4.1 keras==3.15.1

      - name: Run V6, V6.3 & V6.4 optional ML, cache, resolution, IAA & leakage tests (assert 0 skipped)
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
          KERAS_BACKEND: torch
        run: |
          pytest \
            backend/tests/test_embedding_cache_identity.py \
            backend/tests/test_bertopic_pipeline.py \
            backend/tests/test_resolution_engine_v63.py \
            backend/tests/test_phase4_phase5_linking_resolution.py \
            backend/tests/test_annotation_reliability.py \
            backend/tests/test_dataset_expansion_and_leakage_v63.py \
            backend/tests/test_xgboost_baseline.py \
            backend/tests/test_pytorch_keras_models.py \
            backend/tests/test_iim_expansion_v64.py \
            -v --junitxml=/tmp/ml-junit.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/ml-junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          tests = sum(int(s.attrib.get("tests", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          print(f"Optional ML JUnit summary: tests={tests}, skipped={skipped}, failures={failures}, errors={errors}")
          assert tests >= 20, f"Unexpectedly low test count: {tests}"
          assert skipped == 0, f"Optional ML suite skipped {skipped} test(s) instead of running them!"
          assert failures == 0 and errors == 0
          PY
