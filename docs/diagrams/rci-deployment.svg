<svg viewBox="0 0 960 492" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rci-deployment-title rci-deployment-desc" id="rci-deployment-root">
        <title id="rci-deployment-title">Dual Vercel serverless, Docker Compose, and offline workstation topology</title>
        <desc id="rci-deployment-desc">Deployment topology across three trust boundaries: public Vercel serverless read-only API, self-hosted Docker Compose with non-root Python 3.14 and Postgres 16 containers, and an offline loopback workstation for human annotation and GPU training.</desc>
        <defs>
      <style>#rci-deployment-root { --color-paper: #f5f4f0;
      --color-ink: #1e2235;
      --color-muted: #4a526e;
      --color-accent: #4338ca;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #rci-deployment-root { font-family: var(--font-sans); color: var(--color-ink); }
      #rci-deployment-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#rci-deployment-root .diagram-container { overflow-x: visible; }
}</style>
