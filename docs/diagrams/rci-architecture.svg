        <title id="rci-architecture-title">End-to-end anonymized Reddit intelligence platform</title>
        <desc id="rci-architecture-desc">System architecture showing public Reddit threads passing through PII and bot filtering into MuRIL-DAPT v3 and NMF modeling, saved as static JSON artifacts and optional PostgreSQL records for the FastAPI web studio and local human annotation workbench.</desc>
