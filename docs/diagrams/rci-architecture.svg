      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #rci-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #rci-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#rci-architecture-root .diagram-container { overflow-x: visible; }
}</style>
